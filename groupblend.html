<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-CA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GroupBlend</title>
    <style>
        @import url("https://fonts.google.com/css2family=Poppins");
        * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
        }

        body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: url("background.jpg") no-repeat;
        background-size: cover;
        }

        header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        padding: 20px 100px;
        /* background: #3366ff;*/
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 99;
        }

        .logo {
        font-size: 2em;
        color: #fff;
        -webkit-user-select: none;
            -moz-user-select: none;
                user-select: none;
        }

        .blend1 {
        color: goldenrod;
        }

        .blend2 {
        color: #162938;
        }

        .navigation a {
        position: relative;
        font-size: 1.1em;
        color: #fff;
        text-decoration: none;
        font-weight: 500;
        margin-left: 40px;
        }

        .navigation a::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -6px;
        width: 100%;
        height: 3px;
        background: #fff;
        border-radius: 5px;
        transform-origin: right;
        transform: scale(0);
        transition: transform 0.5s;
        }

        .navigation a:hover:after {
        transform-origin: left;
        transform: scale(1);
        }

        .navigation .btnlogin-popup {
        width: 130px;
        height: 50px;
        background: transparent;
        border: 2px solid #fff;
        outline: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 1.1em;
        color: #fff;
        font-weight: 500;
        margin-left: 40px;
        transition: 0.5s;
        }

        .navigation .btnlogin-popup:hover {
        background: #fff;
        color: #162938;
        }

        .navigation .btnreg-popup {
        width: 130px;
        height: 50px;
        background: transparent;
        border: 2px solid #fff;
        outline: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 1.1em;
        color: #fff;
        font-weight: 500;
        margin-left: 40px;
        transition: 0.5s;
        }

        .navigation .btnreg-popup:hover {
        background: #fff;
        color: #162938;
        }

        .container {
        position: relative;
        text-align: center;
        margin-top: 100px;
        right: 8%;
        }

        h1 {
        font-size: 45px;
        margin-bottom: 20px;
        color: white;
        font-family: "Poppins", sans-serif;
        }

        .blend1 {
        font-family: "Poppins", sans-serif;
        color: goldenrod;
        font-weight: 800;
        }

        .blend2 {
        font-family: "Poppins", sans-serif;
        color: #fff;
        font-weight: 800;
        }

        .group {
        color: goldenrod;
        }

        .exc {
        color: #162938;
        }

        .logo1 {
        background-color: #162938;
        border-radius: 50%;
        width: 220px;
        height: 220px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 100px;
        color: #fff;
        animation: bounceRotateAnimation 2s ease-in-out;
        animation-fill-mode: forwards;
        font-family: "Poppins", sans-serif;
        font-weight: 700;
        }

        .wrapper {
        position: relative;
        width: 400px;
        height: 440px;
        background: transparent;
        border: 2px solid rgba(255, 255, 255, 0.5);
        border-radius: 20px;
        -webkit-backdrop-filter: blur(20px);
                backdrop-filter: blur(20px);
        box-shadow: 0, 0, 30px rgba(0, 0, 0, 0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        transform: scale(0);
        transition: transform 0.5s ease, height 0.2s ease;
        }

        .wrapper.active-popup {
        transform: scale(1);
        }

        .wrapper.active {
        top: 20px;
        height: 580px;
        }

        .wrapper .form-box {
        width: 100%;
        padding: 40px;
        }

        .wrapper .form-box.login {
        transition: transform 0.18s ease;
        transform: translateX(0);
        }

        .wrapper.active .form-box.login {
        transition: none;
        transform: translateX(-400px);
        }

        .wrapper .form-box.register {
        position: absolute;
        transition: none;
        transform: translate(400px);
        }

        .wrapper.active .form-box.register {
        transition: transform 0.18s ease;
        transform: translateX(0);
        }

        .wrapper .icon-close {
        position: absolute;
        top: 0;
        right: 0;
        width: 45px;
        height: 45px;
        background: #162938;
        font-size: 2em;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        border-bottom-left-radius: 20px;
        cursor: pointer;
        z-index: 1;
        }

        .form-box h2 {
        font-size: 2em;
        color: #162938;
        text-align: center;
        }

        .input-box {
        position: relative;
        width: 100%;
        height: 50px;
        border-bottom: 2px solid #162938;
        margin: 30px 0;
        }

        .input-box label {
        position: absolute;
        top: 50%;
        left: 5px;
        transform: translateY(-50%);
        font-size: 1em;
        color: #162938;
        font-weight: 500;
        pointer-events: none;
        transition: 0.5s;
        }

        .input-box input:focus ~ label,
        .input-box input:valid ~ label {
        top: -5px;
        }

        .input-box input {
        width: 100%;
        height: 100%;
        background: transparent;
        border: none;
        outline: none;
        font-size: 1em;
        color: #162938;
        font-weight: 600;
        padding: 0 35px 0 5px;
        }

        .input-box .icon {
        position: absolute;
        right: 8px;
        font-size: 1.2em;
        color: #162938;
        line-height: 57px;
        }

        .remember-forgot {
        font-size: 0.9em;
        color: #162938;
        font-weight: 500;
        margin: -15px 0 15px;
        display: flex;
        justify-content: space-between;
        }

        .remember-forgot label input {
        accent-color: #162938;
        margin-right: 3px;
        }

        .remember-forgot a {
        color: #162938;
        text-decoration: none;
        }

        .remember-forgot a:hover {
        text-decoration: underline;
        }

        .btn {
        width: 100%;
        height: 45px;
        background: #162938;
        border: none;
        outline: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 1em;
        color: #fff;
        font-weight: 500;
        }

        .login-register {
        font-size: 0.9em;
        color: #162938;
        text-align: center;
        font-weight: 500;
        margin: 25px 0 10px;
        }

        .login-register p a {
        color: #162938;
        text-decoration: none;
        font-weight: 600;
        }

        .login-register p a:hover {
        text-decoration: underline;
        }

        footer {
        color: #fff;
        bottom: 1px;
        padding: 3px;
        text-align: center;
        font-size: 20px;
        font-weight: 400;
        position: fixed;
        margin-bottom: 0;
        background-color: #162938;
        width: 100%;
        }

        @keyframes bounceRotateAnimation {
        0% {
            transform: translateY(-100px) rotate(0deg);
        }
        50% {
            transform: translateY(0) rotate(0deg);
        }
        100% {
            transform: translateY(0) rotate(360deg);
        }
        }
    </style>
</head>

    <script>
        const wrapper = document.querySelector('.wrapper');
        const loginLink = document.querySelector('.login-link');
        const registerLink = document.querySelector('.register-link');
        const btnLogPopup = document.querySelector('.btnlogin-popup');
        const btnRegPopup = document.querySelector('.btnreg-popup');
        const iconClose = document.querySelector('.icon-close');
        
        registerLink.addEventListener('click', ()=>{
            wrapper.classList.add('active');
        });

        loginLink.addEventListener('click', ()=>{
            wrapper.classList.remove('active');
        });

        btnLogPopup.addEventListener('click', ()=>{
            wrapper.classList.add('active-popup');
            wrapper.classList.remove('active');
        });

        btnRegPopup.addEventListener('click', ()=>{
            wrapper.classList.add('active-popup');
            wrapper.classList.add('active');
        });

        iconClose.addEventListener('click', ()=>{
            wrapper.classList.remove('active-popup');
        });

        // Going to the next page
        document.getElementById("btn").addEventListener("click", ()=>{
            var password = document.getElementById("password").value;
            var confirmPassword = document.getElementById("confirmPassword").value;
            // Check if the password and the confirmed password match
            if (password !== confirmPassword) {
            document.getElementById("passwordMismatchError").style.display = "block";
            return;
            }
        });
</script>
